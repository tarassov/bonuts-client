services:
  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache git && corepack enable && yarn install --frozen-lockfile && yarn dev --host 0.0.0.0"
    ports:
      - "3002:3002"
      - "6006:6006"
    environment:
      HUSKY: "0"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
